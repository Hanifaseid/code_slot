services:
  postgres:
    image: postgres:16-alpine
    container_name: codeslot-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codeslot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codeslot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codeslot-network

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: codeslot-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-codeslot}?schema=public
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      API_PREFIX: /api
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-codeslot_super_secret_jwt_key_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codeslot-network

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: codeslot-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: http://localhost:5000/api
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
    depends_on:
      - backend
    networks:
      - codeslot-network

volumes:
  postgres_data:
    driver: local

networks:
  codeslot-network:
    driver: bridge
